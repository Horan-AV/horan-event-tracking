# Runs the tests on every pull request and on main, so a problem is caught before it's released.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Python the app supports (what a Mac comes with). GitHub's newest machines no longer
          # offer it, so this one runs on an older image.
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check the code compiles
        run: |
          python -m py_compile server.py macos/build_pkg.py
          for f in static/*.js; do node --check "$f"; done
          python -c "import json; json.load(open('static/changelog.json'))"
      - name: Run the tests
        run: python -m unittest discover -s tests -v
