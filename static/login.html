<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="icon" href="/favicon">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --green: #1f5c3d; --gold: #c9a227; --grey: #55595e; --bg: #f3f2ee; --card: #fff; --text: #1d1f21; --line: #dcdcd6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151816; --card: #1e2320; --text: #ecece8; --line: #39403b; --grey: #a5aaa7; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .08); }
  .brand { border-left: 4px solid var(--gold); padding-left: 12px; margin-bottom: 22px; }
  .brand img { max-height: 64px; object-fit: contain; max-width: 220px; display: block; margin-bottom: 8px; }
  .brand strong { display: block; font-size: 20px; color: var(--green); }
  @media (prefers-color-scheme: dark) { .brand strong { color: #7fc39d; } }
  .brand span { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  p { color: var(--grey); margin: 0 0 16px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; font-size: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
  input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  button { margin-top: 14px; width: 100%; padding: 12px; font-size: 16px; font-weight: 600; border: 0; border-radius: 8px;
    background: var(--green); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .6; }
  .err { color: #c0392b; font-size: 14px; min-height: 20px; margin-top: 10px; }
  .people { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .people button { width: auto; margin: 0; padding: 9px 14px; font-size: 15px; font-weight: 600; border-radius: 999px;
    background: transparent; color: inherit; border: 1px solid var(--line); }
  .people button[aria-checked="true"] { background: var(--green); border-color: var(--green); color: #fff; }
</style>
</head>
<body>
<main>
  <div class="brand"><picture id="lg" hidden><source srcset="/logo?variant=dark" media="(prefers-color-scheme: dark)"><img src="/logo" alt="" onerror="this.closest('picture').remove()"></picture><strong id="bn"></strong><span id="bs"></span></div>
  <p id="intro">Enter the passcode.</p>
  <form id="f">
    <div id="who" hidden>
      <label>Who are you?</label>
      <div class="people" id="people" role="radiogroup" aria-label="Who are you?"></div>
    </div>
    <label for="pc" id="pc-label">Passcode</label>
    <input id="pc" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<script>
  let mode = 'passcode', who = null;
  const $ = (id) => document.getElementById(id);
  fetch('/api/login-options').then((r) => r.json()).then((o) => {
    const name = o.app_name || 'Horan Event Tracking';
    const renamed = !o.default_name;
    document.title = 'Sign in · ' + name;
    // The app's own logo already says what it is; a renamed app shows its name (and its own logo, if one was uploaded).
    if (o.has_logo || !renamed) $('lg').hidden = false;
    if (renamed) $('bn').textContent = name;
    $('intro').textContent = 'Enter the passcode set on the computer running ' + name + '.';
    if (o.mode !== 'users') { $('intro').textContent = 'This device is connecting over the network. Enter the passcode set on the computer running ' + name + '.'; return; }
    mode = 'users';
    $('intro').textContent = 'Choose your name and enter your PIN.';
    $('pc-label').textContent = 'PIN';
    $('pc').setAttribute('inputmode', 'numeric');
    $('pc').autocomplete = 'off';
    $('who').hidden = false;
    let last = null;
    try { last = localStorage.getItem('het-last-user'); } catch (e) {}
    const pick = (b) => {
      who = Number(b.dataset.id);
      for (const x of $('people').children) x.setAttribute('aria-checked', String(x === b));
      $('pc').value = ''; $('pc').focus();
    };
    for (const u of o.users) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = u.name; b.dataset.id = u.id; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false');
      b.onclick = () => pick(b);
      $('people').appendChild(b);
      if (String(u.id) === last || o.users.length === 1) pick(b);
    }
  }).catch(() => {});
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('go'), err = document.getElementById('err');
    if (mode === 'users' && !who) { err.textContent = 'Choose your name first'; return; }
    btn.disabled = true; err.textContent = '';
    try {
      const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'horan-rms' },
        body: JSON.stringify(mode === 'users' ? { user_id: who, pin: $('pc').value } : { passcode: $('pc').value }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Sign-in failed');
      try { if (who) localStorage.setItem('het-last-user', String(who)); } catch (e2) {}
      location.reload();
    } catch (ex) {
      err.textContent = ex.message;
      btn.disabled = false;
      document.getElementById('pc').select();
    }
  });
</script>
</body>
</html>
